<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>התראה לצוות</title>
    <!-- Веб-приложение (PWA): название, значок и вид при установке на экран телефона -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="התראה לצוות" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        background-color: #f4f5f7;
      }
      /* Иврит пишется справа налево: весь интерфейс зеркалится. */
      html {
        direction: rtl;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript>יש להפעיל JavaScript כדי להשתמש באפליקציה.</noscript>
    <div id="root"></div>
  </body>
</html>
